<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efefef">
  <meta name="description" content="Rick and Morty themed placeholder text generator.">
  <title>Lorum Ricksum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pangolin&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site">
    <header class="heading">
      <div class="heading-copy">
        <p>Lorem Ipsum + Rum + Rick Quotes = Lorum Ricksum</p>
        <p>Generate some placeholder text from things Rick Sanchez has said in Rick &amp; Morty.</p>
      </div>
      <h1>Lorum Ricksum</h1>
    </header>

    <main class="workspace">
      <section class="options" aria-label="Text generation options">
        <h2>How to generate text:</h2>
        <fieldset class="radio">
          <legend class="sr-only">Text type</legend>
          <label class="radiochoice" for="wordchoice">
            <input type="radio" name="wordtype" id="wordchoice" checked>
            <span>Words</span>
          </label>
          <span class="or">OR</span>
          <label class="radiochoice" for="parachoice">
            <input type="radio" name="wordtype" id="parachoice">
            <span>Paragraphs</span>
          </label>
        </fieldset>

        <label class="number-heading" for="num">Number needed:</label>
        <input class="textInput" id="num" value="5" type="number" min="0" max="999" step="1" inputmode="numeric">

        <h2 class="pickle-instruction">Click on Pickle Rick to toggle &lt;p&gt; tags in output.</h2>
        <input class="toggle-input" type="checkbox" id="ptags" checked>
        <label for="ptags" class="picklerick" aria-label="Toggle paragraph tags">
          <span class="portal" aria-hidden="true"><span class="portal-text">&lt;p&gt;&lt;/p&gt;</span></span>
          <img src="https://static.wikia.nocookie.net/rickandmorty/images/4/41/Pickle_rick_transparent_edgetrimmed.png" alt="Pickle Rick" loading="eager">
        </label>

        <button type="button" id="gobut" class="generate-button" onclick="showWords(document.getElementById('num').value)">
          GENERATE TEXT <span class="edit-symbol" aria-hidden="true">✎</span>
        </button>
      </section>

      <section class="output-area" aria-label="Generated placeholder text">
        <div class="paper" id="text">
          <button id="copybutt" class="copy-button" type="button" onclick="CopyToClipboard()" aria-label="Copy generated text" title="Copy generated text">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h10a2 2 0 0 1 2 2v12h-2V5H8V3Zm-4 4h10a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Zm0 2v11h10V9H4Z"/></svg>
          </button>
          <div id="words" aria-live="polite" aria-atomic="true"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
